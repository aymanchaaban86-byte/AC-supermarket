let cart={},ac='all',st='';
function rCats(){document.getElementById('catList').innerHTML=[{id:'all',name:'الكل',icon:'🛒'},...CATS].map(c=>`<div class="cat ${c.id===ac?'active':''}" onclick="fc('${c.id}','${c.name}')"><div class="ci">${c.icon}</div><div>${c.name}</div></div>`).join('');}
function fc(id,name){ac=id;document.getElementById('si').value='';st='';rCats();rProds();document.getElementById('catTitle').textContent=id==='all'?'كل المنتجات':name;}
function srch(){st=document.getElementById('si').value.trim();ac='all';rCats();rProds();document.getElementById('catTitle').textContent=st?`نتائج: "${st}"`:'كل المنتجات';}
function gf(){let l=PRODS;if(ac!=='all')l=l.filter(p=>p.cat===ac);if(st)l=l.filter(p=>p.name.toLowerCase().includes(st.toLowerCase()));return l;}
function rProds(){const l=gf();document.getElementById('rc').textContent=l.length?`${l.length} منتج`:'';if(!l.length){document.getElementById('productList').innerHTML='<div class="em">📦 لا يوجد منتجات</div>';return;}document.getElementById('productList').innerHTML=l.map(p=>`<div class="pr"><img class="pi" src="${p.img||'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300&q=80'}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300&q=80'"><div class="pb"><div class="pn">${p.name}</div><div class="pp">$${p.price.toFixed(2)}</div><button class="ab" onclick="addCart(${p.id},this)">+ أضف للسلة</button></div></div>`).join('');}
function addCart(id,btn){cart[id]=(cart[id]||0)+1;uc();btn.textContent='✓ تمت الإضافة';btn.classList.add('added');setTimeout(()=>{btn.textContent='+ أضف للسلة';btn.classList.remove('added');},1200);}
function uc(){document.getElementById('cc').textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
function rCart(){const it=Object.entries(cart).filter(([,q])=>q>0);const el=document.getElementById('cartList');if(!it.length){el.innerHTML='<div class="em">🛒 السلة فارغة</div>';document.getElementById('cartSummary').innerHTML='';return;}el.innerHTML=it.map(([id,qty])=>{const p=PRODS.find(x=>x.id==id);return `<div class="ci2"><img src="${p.img||''}" onerror="this.style.display='none'"><div class="in"><div class="nm">${p.name}</div><div class="pr2">$${p.price.toFixed(2)}</div></div><div class="qc"><button class="qb" onclick="cq(${id},-1)">−</button><span class="qn">${qty}</span><button class="qb" onclick="cq(${id},1)">+</button></div></div>`;}).join('');rSum('cartSummary');}
function cq(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];uc();rCart();}
function rSum(el){const sub=Object.entries(cart).reduce((s,[id,q])=>{const p=PRODS.find(x=>x.id==id);return s+(p?p.price*q:0);},0);const del=sub>0?2:0;document.getElementById(el).innerHTML=`<div class="sr"><span>المجموع الفرعي</span><span>$${sub.toFixed(2)}</span></div><div class="sr"><span>رسوم التوصيل</span><span>$${del.toFixed(2)}</span></div><div class="sr tot"><span>المجموع الكلي</span><span>$${(sub+del).toFixed(2)}</span></div>`;}
function sendWA(){const fn=document.getElementById('fn').value;const ph=document.getElementById('ph').value;const ad=document.getElementById('ad').value;if(!fn||!ph||!ad){alert('يرجى تعبئة الاسم ورقم الهاتف والعنوان');return;}const it=Object.entries(cart).filter(([,q])=>q>0);const sub=it.reduce((s,[id,q])=>{const p=PRODS.find(x=>x.id==id);return s+(p?p.price*q:0);},0);let msg=`🛒 *طلب جديد - Souna*\n\n👤 *الاسم:* ${fn} ${document.getElementById('ln').value}\n📞 *الهاتف:* ${ph}\n📍 *العنوان:* ${ad}، ${document.getElementById('ar').value}، ${document.getElementById('ct').value}\n`;const nt=document.getElementById('nt').value;if(nt)msg+=`📝 *ملاحظات:* ${nt}\n`;msg+=`\n*المنتجات:*\n`;it.forEach(([id,qty])=>{const p=PRODS.find(x=>x.id==id);msg+=`• ${p.name} × ${qty} = $${(p.price*qty).toFixed(2)}\n`;});msg+=`\n💰 *المجموع:* $${(sub+2).toFixed(2)} (شامل التوصيل)`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');sp('success');}
function sp(name){document.querySelectorAll('.pg2').forEach(p=>p.classList.remove('active'));document.getElementById(name+'Page').classList.add('active');if(name==='cart')rCart();if(name==='checkout')rSum('checkoutSummary');window.scrollTo(0,0);}
function resetOrder(){cart={};uc();sp('shop');}
rCats();rProds();
</script>

<title>AC Super Market</title>
<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
  header{background:#fff;border-bottom:1px solid #e8e8e0;position:sticky;top:0;z-index:100;padding:0 1rem}
  .header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{font-size:20px;font-weight:700}.logo span{color:#16a34a}
  .cart-btn{display:flex;align-items:center;gap:6px;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600}
  .cart-badge{background:#fff;color:#16a34a;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
  main{max-width:960px;margin:0 auto;padding:1rem}
  .hero{background:linear-gradient(135deg,#16a34a,#15803d);border-radius:14px;padding:1.5rem;margin-bottom:1rem;color:#fff;display:flex;align-items:center;justify-content:space-between}
  .hero h1{font-size:20px;font-weight:700;margin-bottom:4px}.hero p{font-size:13px;opacity:0.85}.hero-icon{font-size:48px}
  .search-box{background:#fff;border:1.5px solid #e8e8e0;border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;margin-bottom:1rem}
  .search-box input{border:none;outline:none;font-family:'Cairo',sans-serif;font-size:14px;flex:1;background:transparent}
  .cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:1rem}
  .cat{background:#fff;border:2px solid #e8e8e0;border-radius:10px;padding:8px 6px;cursor:pointer;font-size:11px;font-weight:600;color:#555;text-align:center;transition:all 0.15s}
  .cat-icon{font-size:20px;margin-bottom:3px}
  .cat.active,.cat:hover{border-color:#16a34a;color:#16a34a;background:#f0fdf4}
  .section-title{font-size:15px;font-weight:700;margin-bottom:0.75rem;color:#1a1a1a}
  .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .prod{background:#fff;border-radius:12px;border:1px solid #e8e8e0;overflow:hidden;display:flex;flex-direction:column}
  .prod-img{width:100%;height:130px;object-fit:contain;background:#f8f8f8;padding:6px}
  .prod-body{padding:8px}
  .prod-name{font-size:11px;font-weight:600;color:#1a1a1a;margin-bottom:3px;line-height:1.4;min-height:32px}
  .prod-price{font-size:13px;font-weight:700;color:#16a34a;margin-bottom:8px}
  .add-btn{background:#16a34a;color:#fff;border:none;border-radius:7px;padding:7px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;width:100%;transition:background 0.15s}
  .add-btn:hover{background:#15803d}.add-btn.added{background:#dcfce7;color:#16a34a}
  .page{display:none}.page.active{display:block}
  .back{background:none;border:none;color:#16a34a;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;margin-bottom:0.75rem;display:flex;align-items:center;gap:4px}
  .page-title{font-size:16px;font-weight:700;margin-bottom:0.75rem}
  .cart-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
  .ci{background:#fff;border-radius:10px;border:1px solid #e8e8e0;padding:0.75rem;display:flex;align-items:center;gap:10px}
  .ci-img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#f8f8f8;padding:3px;flex-shrink:0}
  .ci-info{flex:1}.ci-name{font-size:12px;font-weight:600}.ci-price{font-size:11px;color:#888}
  .qty-ctrl{display:flex;align-items:center;gap:6px}
  .qb{width:26px;height:26px;border:1.5px solid #e8e8e0;border-radius:6px;background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .qn{font-size:13px;font-weight:700;min-width:18px;text-align:center}
  .summary{background:#fff;border-radius:12px;border:1px solid #e8e8e0;padding:1rem;margin-bottom:0.75rem}
  .srow{display:flex;justify-content:space-between;font-size:13px;color:#666;padding:4px 0}
  .srow.total{font-size:15px;font-weight:700;color:#1a1a1a;border-top:1px solid #e8e8e0;margin-top:6px;padding-top:10px}
  .wa-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:12px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .form-section{background:#fff;border-radius:12px;border:1px solid #e8e8e0;padding:1rem;margin-bottom:0.75rem}
  .fl{font-size:12px;color:#666;margin-bottom:4px;display:block;font-weight:500}
  .fi{width:100%;padding:8px 10px;border:1.5px solid #e8e8e0;border-radius:7px;font-family:'Cairo',sans-serif;font-size:13px;background:#fff;outline:none;margin-bottom:10px}
  .fi:focus{border-color:#16a34a}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .empty{text-align:center;padding:2rem 1rem;color:#aaa}
  .empty-icon{font-size:40px;margin-bottom:10px}
  .success{text-align:center;padding:2rem 1rem}

  .success h2{font-size:20px;font-weight:700;margin-bottom:6px}

  .results-count{font-size:12px;color:#888;margin-bottom:0.5rem}
  @media(max-width:500px){.hero-icon{display:none}.products-grid{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:1fr}.cats-grid{grid-template-columns:repeat(3,1fr)}}
</style>

<header>
  <div class="header-inner">
    <div class="logo">AC <span>Super Market</span></div>
    <button class="cart-btn" onclick="showPage('cart')">🛒 السلة<span class="cart-badge" id="cartCount">0</span></button>
  </div>
</header>
<main>
  <div class="page active" id="shopPage">
    <div class="hero">
      <div><h1>AC Super Market</h1><p>توصيل سريع لباب بيتك 🚀</p></div>
      <div class="hero-icon">🛍️</div>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث عن منتج..." oninput="searchProducts()">
    </div>
    <div class="cats-grid" id="catList"></div>
    <div class="section-title" id="catTitle">كل المنتجات</div>
    <div class="results-count" id="resultsCount"></div>
    <div class="products-grid" id="productList"></div>
  </div>
  <div class="page" id="cartPage">
    <button class="back" onclick="showPage('shop')">← متابعة التسوق</button>
    <div class="page-title">🛒 سلتك</div>
    <div class="cart-list" id="cartList"></div>
    <div class="summary" id="cartSummary"></div>
    <button class="wa-btn" onclick="showPage('checkout')">📦 إكمال الطلب</button>
  </div>
  <div class="page" id="checkoutPage">
    <button class="back" onclick="showPage('cart')">← الرجوع للسلة</button>
    <div class="page-title">📋 بيانات التوصيل</div>
    <div class="form-section">
      <div class="frow">
        <div><label class="fl">الاسم الأول</label><input class="fi" id="fname" placeholder="محمد"/></div>
        <div><label class="fl">الاسم الأخير</label><input class="fi" id="lname" placeholder="الأحمد"/></div>
      </div>
      <label class="fl">رقم الهاتف</label><input class="fi" id="phone" placeholder="+961 70 000 000"/>
      <label class="fl">العنوان</label><input class="fi" id="address" placeholder="المنطقة، الشارع، المبنى، الطابق"/>
      <div class="frow">
        <div><label class="fl">المدينة</label><input class="fi" id="city" placeholder="طرابلس"/></div>
        <div><label class="fl">المنطقة</label><input class="fi" id="area" placeholder="المنطقة"/></div>
      </div>
      <label class="fl">ملاحظات (اختياري)</label><input class="fi" id="notes" placeholder="أي تعليمات للتوصيل..."/>
    </div>
    <div class="summary" id="checkoutSummary"></div>
    <button class="wa-btn" onclick="sendWhatsApp()">📱 أرسل الطلب على WhatsApp</button>
  </div>
  <div class="page" id="successPage">
    <div class="success">
      <div class="success-icon">✅</div>
      <h2>تم إرسال طلبك!</h2>
      <p>سيتم التواصل معك قريباً لتأكيد الطلب وموعد التوصيل</p>
      <button class="new-order-btn" onclick="resetOrder()">طلب جديد</button>
    </div>
  </div>
</main>

let cart={},activeCat='all',searchTerm='';

function renderCats(){
  document.getElementById('catList').innerHTML=cats.map(c=>
    `<div class="cat ${c.id===activeCat?'active':''}" onclick="filterCat('${c.id}','${c.name}')">
      <div class="cat-icon">${c.icon}</div><div>${c.name}</div>
    </div>`).join('');
}

function filterCat(id,name){
  activeCat=id;
  document.getElementById('searchInput').value='';
  searchTerm='';
  renderCats();
  renderProducts();
  document.getElementById('catTitle').textContent=id==='all'?'كل المنتجات':name;
}

function searchProducts(){
  searchTerm=document.getElementById('searchInput').value.trim();
  activeCat='all';
  renderCats();
  renderProducts();
  document.getElementById('catTitle').textContent=searchTerm?`نتائج: "${searchTerm}"` :'كل المنتجات';
}

function getFilteredProducts(){
  let list=products;
  if(activeCat!=='all') list=list.filter(p=>p.cat===activeCat);
  if(searchTerm) list=list.filter(p=>p.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return list;
}

function renderProducts(){
  const list=getFilteredProducts();
  document.getElementById('resultsCount').textContent=list.length>0?`${list.length} منتج`:'';
  if(!list.length){
    document.getElementById('productList').innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>لا يوجد منتجات في هذه الفئة حالياً</p></div>';
    return;
  }
  document.getElementById('productList').innerHTML=list.map(p=>`
    <div class="prod">
      <img class="prod-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">
      <div class="prod-body">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">$${p.price.toFixed(2)}</div>
        <button class="add-btn" onclick="addToCart(${p.id},this)">+ أضف للسلة</button>
      </div>
    </div>`).join('');
}

function addToCart(id,btn){
  cart[id]=(cart[id]||0)+1;updateCount();
  btn.textContent='✓ تمت الإضافة';btn.classList.add('added');
  setTimeout(()=>{btn.textContent='+ أضف للسلة';btn.classList.remove('added');},1200);
}

function updateCount(){
  document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}

function renderCart(){
  const items=Object.entries(cart).filter(([,q])=>q>0);
  const el=document.getElementById('cartList');
  if(!items.length){el.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>السلة فارغة</p></div>';document.getElementById('cartSummary').innerHTML='';return;}
  el.innerHTML=items.map(([id,qty])=>{
    const p=products.find(x=>x.id==id);
    return `<div class="ci">
      <img class="ci-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">
      <div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-price">$${p.price.toFixed(2)}</div></div>
      <div class="qty-ctrl">
        <button class="qb" onclick="changeQty(${id},-1)">−</button>
        <span class="qn">${qty}</span>
        <button class="qb" onclick="changeQty(${id},1)">+</button>
      </div>
    </div>`;}).join('');
  renderSummary('cartSummary');
}

function changeQty(id,delta){
  cart[id]=Math.max(0,(cart[id]||0)+delta);
  if(!cart[id])delete cart[id];updateCount();renderCart();
}

function renderSummary(elId){
  const sub=Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id==id);return s+(p?p.price*q:0);},0);
  const del=sub>0?2:0;
  document.getElementById(elId).innerHTML=`
    <div class="srow"><span>المجموع الفرعي</span><span>$${sub.toFixed(2)}</span></div>
    <div class="srow"><span>رسوم التوصيل</span><span>$${del.toFixed(2)}</span></div>
    <div class="srow total"><span>المجموع الكلي</span><span>$${(sub+del).toFixed(2)}</span></div>`;
}

function sendWhatsApp(){
  const fname=document.getElementById('fname').value;
  const lname=document.getElementById('lname').value;
  const phone=document.getElementById('phone').value;
  const address=document.getElementById('address').value;
  const city=document.getElementById('city').value;
  const area=document.getElementById('area').value;
  const notes=document.getElementById('notes').value;
  if(!fname||!phone||!address){alert('يرجى تعبئة الاسم ورقم الهاتف والعنوان');return;}
  const items=Object.entries(cart).filter(([,q])=>q>0);
  const sub=items.reduce((s,[id,q])=>{const p=products.find(x=>x.id==id);return s+(p?p.price*q:0);},0);
  let msg=`🛒 *طلب جديد - AC Super Market*\n\n👤 *الاسم:* ${fname} ${lname}\n📞 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}، ${area}، ${city}\n`;
  if(notes)msg+=`📝 *ملاحظات:* ${notes}\n`;
  msg+=`\n*المنتجات:*\n`;
  items.forEach(([id,qty])=>{const p=products.find(x=>x.id==id);msg+=`• ${p.name} × ${qty} = $${(p.price*qty).toFixed(2)}\n`;});
  msg+=`\n💰 *المجموع:* $${(sub+2).toFixed(2)} (شامل التوصيل)`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
  showPage('success');
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(name+'Page').classList.add('active');
  if(name==='cart')renderCart();
  if(name==='checkout')renderSummary('checkoutSummary');
  window.scrollTo(0,0);
}

function resetOrder(){cart={};updateCount();showPage('shop');}

renderCats();renderProducts();
</script>
</body>
</html>

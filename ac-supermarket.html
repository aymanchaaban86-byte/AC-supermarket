<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souna | سونا</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e8e8e0;position:sticky;top:0;z-index:100;padding:0 1rem}
.hi{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo-w span{font-size:24px;font-weight:800;color:#16a34a}
.logo-s{font-size:11px;color:#888;display:block;margin-top:-4px}
.sb{flex:1;max-width:400px;background:#f5f5f0;border:1.5px solid #e8e8e0;border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px}
.sb input{border:none;outline:none;font-family:'Cairo',sans-serif;font-size:14px;flex:1;background:transparent}
.cart-btn{display:flex;align-items:center;gap:6px;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700}
.cart-c{background:#fff;color:#16a34a;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.rate-bar{background:#f0fdf4;border-bottom:1px solid #dcfce7;padding:6px 1rem;text-align:center;font-size:12px;font-weight:600;color:#15803d}
main{max-width:1100px;margin:0 auto;padding:1rem}
.hero{width:100%;border-radius:16px;overflow:hidden;margin-bottom:1rem;position:relative}
.hero img{width:100%;display:block;border-radius:16px}
.shop-layout{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.cats-sidebar{background:#fff;border-radius:12px;border:1px solid #e8e8e0;overflow-y:auto;position:sticky;top:72px;max-height:calc(100vh - 90px);scrollbar-width:thin;scrollbar-color:#d1d5db transparent}
.cats-sidebar-title{padding:12px 14px;font-size:12px;font-weight:700;color:#888;border-bottom:1px solid #f0f0f0;text-transform:uppercase;letter-spacing:0.5px}
.cat-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:0.5px solid #f9f9f9;font-size:13px;font-weight:600;color:#444;transition:all 0.15s;border-right:3px solid transparent}
.cat-item:hover{background:#f9f9f9;color:#16a34a}
.cat-item.active{background:#f0fdf4;color:#16a34a;border-right-color:#16a34a}
.cat-item .ci{font-size:18px;flex-shrink:0}
.cat-item .cn{flex:1}
.cat-item .cc{font-size:11px;color:#aaa;background:#f5f5f0;border-radius:20px;padding:1px 7px}
.cat-item.active .cc{background:#dcfce7;color:#16a34a}
.products-area .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.products-area .section-title{font-size:15px;font-weight:700}
.results-count{font-size:12px;color:#888}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.pr{background:#fff;border-radius:12px;border:1px solid #e8e8e0;overflow:hidden;display:flex;flex-direction:column;transition:transform 0.15s,box-shadow 0.15s}
.pr:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.pi{width:100%;height:140px;object-fit:contain;background:#f8f8f8;padding:8px}
.pb{padding:10px;flex:1;display:flex;flex-direction:column}
.pn{font-size:11px;font-weight:600;color:#1a1a1a;margin-bottom:6px;line-height:1.4;min-height:32px}
.pp{font-size:15px;font-weight:800;color:#16a34a}
.plbp{font-size:10px;color:#aaa;margin-bottom:8px}
.ab{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;width:100%;margin-top:auto;transition:background 0.15s}
.ab:hover{background:#15803d}.ab.added{background:#dcfce7;color:#16a34a}
.pg2{display:none}.pg2.active{display:block}
.bk{background:none;border:none;color:#16a34a;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.pt{font-size:16px;font-weight:700;margin-bottom:12px}
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.cart-items-card{background:#fff;border-radius:12px;border:1px solid #e8e8e0;overflow:hidden}
.cart-header{padding:14px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:700}
.ci2{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:0.5px solid #f9f9f9}
.ci2 img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#f8f8f8;padding:4px;flex-shrink:0}
.ci2 .in{flex:1}.in .nm{font-size:12px;font-weight:600}.in .pr2{font-size:13px;font-weight:700;color:#16a34a}.in .lb{font-size:10px;color:#aaa}
.qc{display:flex;align-items:center;gap:6px}
.qb{width:28px;height:28px;border:1.5px solid #e8e8e0;border-radius:7px;background:none;cursor:pointer;font-size:14px;font-weight:700;transition:all 0.15s}
.qb:hover{background:#16a34a;color:#fff;border-color:#16a34a}
.qn{font-size:13px;font-weight:700;min-width:20px;text-align:center}
.sm-card{background:#fff;border-radius:12px;border:1px solid #e8e8e0;padding:16px;position:sticky;top:72px}
.sm-title{font-size:14px;font-weight:700;margin-bottom:12px}
.sr{display:flex;justify-content:space-between;font-size:13px;color:#666;padding:5px 0}
.sr.tot{font-size:16px;font-weight:700;color:#1a1a1a;border-top:1.5px solid #f0f0f0;margin-top:6px;padding-top:10px}
.wa-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.fs{background:#fff;border-radius:12px;border:1px solid #e8e8e0;padding:16px;margin-bottom:12px}
.fs h3{font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.fl{font-size:12px;color:#666;margin-bottom:4px;display:block;font-weight:500}
.fi{width:100%;padding:9px 12px;border:1.5px solid #e8e8e0;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;background:#fff;outline:none;margin-bottom:10px}
.fi:focus{border-color:#16a34a}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved-badge{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;font-size:12px;color:#15803d;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.em{text-align:center;padding:32px;color:#aaa}
.sc{text-align:center;padding:2rem}
.nb{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 24px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700}
@media(max-width:768px){
  .shop-layout{grid-template-columns:1fr}
  .cats-sidebar{position:static;display:flex;overflow-x:auto;border-radius:10px}
  .cats-sidebar-title{display:none}
  .cat-item{flex-direction:column;gap:4px;padding:10px 12px;min-width:70px;border-bottom:none;border-right:none;border-bottom:3px solid transparent;flex-shrink:0}
  .cat-item.active{border-bottom-color:#16a34a;border-right-color:transparent}
  .cat-item .cn{font-size:10px}
  .cat-item .cc{display:none}
  .cart-layout{grid-template-columns:1fr}
  .sm-card{position:static}
  .fr{grid-template-columns:1fr}
  .hero-icon{display:none}
}
</style>
</head>

isoftlb.com%2FPics%2FBHomaysi%2FItemFile%2F7c29abff-54f9-410d-9c4a-d96239afb615.jpg&w=1920&q=75","cat":"meat"},{"id":2238,"name":"نقانق  500غ","price":6.613,"img":"https://www.kheirwbarake.com/_next/image?url=http%3A%2F%2Fapp.antisoftlb.com%2FPics%2FBHomaysi%2FItemFile%2F%D9%85%D9%82%D8%A7%D9%86%D9%82%206-12.jpeg&w=1920&q=75","cat":"meat"},{"id":2239,"name":"همبرغر  500غ","price":6.613,"img":"https://www.kheirwbarake.com/_next/image?url=http%3A%2F%2Fapp.antisoftlb.com%2FPics%2FBHomaysi%2FItemFile%2F%D9%87%D9%85%D8%A8%D8%B1%D8%BA%D8%B1%206-12.jpeg&w=1920&q=75","cat":"meat"},{"id":2240,"name":"صدر مسحب","price":6.005,"img":"https://www.kheirwbarake.com/_next/image?url=http%3A%2F%2Fapp.antisoftlb.com%2FPics%2FBHomaysi%2FItemFile%2F09f55218-db25-4b01-b47f-216061b2e5e1.jpg&w=1920&q=75","cat":"meat"}];
let cart={},ac='all',st='';

function rCats(){
  const counts={};
  PRODS.forEach(p=>{counts[p.cat]=(counts[p.cat]||0)+1;});
  document.getElementById('catList').innerHTML=
    '<div class="cats-sidebar-title">الفئات</div>'+
    [{id:'all',name:'كل المنتجات',icon:'🛒'},...CATS].map(c=>{
      const cnt=c.id==='all'?PRODS.length:(counts[c.id]||0);
      return `<div class="cat-item ${c.id===ac?'active':''}" onclick="fc('${c.id}','${c.name}')">
        <span class="ci">${c.icon}</span>
        <span class="cn">${c.name}</span>
        <span class="cc">${cnt}</span>
      </div>`;
    }).join('');
}

function fc(id,name){ac=id;document.getElementById('si').value='';st='';rCats();rProds();if(document.getElementById('prodCount'))document.getElementById('prodCount').textContent=PRODS.length;document.getElementById('catTitle').textContent=id==='all'?'كل المنتجات':name;}
function srch(){st=document.getElementById('si').value.trim();ac='all';rCats();rProds();document.getElementById('catTitle').textContent=st?`نتائج: "${st}"`:'كل المنتجات';}
function gf(){let l=PRODS;if(ac!=='all')l=l.filter(p=>p.cat===ac);if(st)l=l.filter(p=>p.name.toLowerCase().includes(st.toLowerCase()));return l;}
function rProds(){
  const l=gf();
  const prodArea=document.getElementById('productsArea');
  if(ac==='all'&&!st){
    prodArea.style.display='none';
    return;
  }
  prodArea.style.display='block';
  document.getElementById('rc').textContent=l.length?`${l.length} منتج`:'';
  if(!l.length){document.getElementById('productList').innerHTML='<div class="em">📦 لا يوجد منتجات</div>';return;}
  document.getElementById('productList').innerHTML=l.map(p=>{
    const lbp=Math.round(p.price*RATE).toLocaleString();
    return `<div class="pr">
      <img class="pi" src="${p.img||''}" alt="${p.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300&q=80'">
      <div class="pb">
        <div class="pn">${p.name}</div>
        <div class="pp">$${p.price.toFixed(2)}</div>
        <div class="plbp">${lbp} ل.ل.</div>
        <button class="ab" onclick="addCart(${p.id},this)">+ أضف للسلة</button>
      </div>
    </div>`;
  }).join('');
}

function addCart(id,btn){cart[id]=(cart[id]||0)+1;uc();btn.textContent='✓ تمت الإضافة';btn.classList.add('added');setTimeout(()=>{btn.textContent='+ أضف للسلة';btn.classList.remove('added');},1200);}
function uc(){document.getElementById('cnt').textContent=Object.values(cart).reduce((a,b)=>a+b,0);}

function rCart(){
  const it=Object.entries(cart).filter(([,q])=>q>0);
  const el=document.getElementById('cartList');
  if(!it.length){el.innerHTML='<div class="em">🛒 السلة فارغة</div>';document.getElementById('cartSummary').innerHTML='';return;}
  el.innerHTML=it.map(([id,qty])=>{
    const p=PRODS.find(x=>x.id==id);
    const lbp=Math.round(p.price*RATE).toLocaleString();
    return `<div class="ci2">
      <img src="${p.img||''}" onerror="this.style.display='none'">
      <div class="in">
        <div class="nm">${p.name}</div>
        <div class="pr2">$${p.price.toFixed(2)}</div>
        <div class="lb">${lbp} ل.ل.</div>
      </div>
      <div class="qc">
        <button class="qb" onclick="cq(${id},-1)">−</button>
        <span class="qn">${qty}</span>
        <button class="qb" onclick="cq(${id},1)">+</button>
      </div>
    </div>`;
  }).join('');
  rSum('cartSummary');
}

function cq(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];uc();rCart();}

function rSum(el){
  const sub=Object.entries(cart).reduce((s,[id,q])=>{const p=PRODS.find(x=>x.id==id);return s+(p?p.price*q:0);},0);
  const del=sub>0?2:0;
  const lbpTotal=Math.round((sub+del)*RATE).toLocaleString();
  document.getElementById(el).innerHTML=`
    <div class="sr"><span>المجموع الفرعي</span><span>$${sub.toFixed(2)}</span></div>
    <div class="sr"><span>رسوم التوصيل</span><span>$${del.toFixed(2)}</span></div>
    <div class="sr tot"><span>الإجمالي</span><span>$${(sub+del).toFixed(2)}</span></div>
    <div style="text-align:center;font-size:11px;color:#aaa;margin-top:6px">${lbpTotal} ل.ل.</div>`;
}

function loadSavedInfo(){
  const saved=JSON.parse(localStorage.getItem('souna_customer')||'{}');
  if(saved.fn){
    document.getElementById('fn').value=saved.fn||'';
    document.getElementById('ln').value=saved.ln||'';
    document.getElementById('ph').value=saved.ph||'';
    document.getElementById('ad').value=saved.ad||'';
    document.getElementById('ct').value=saved.ct||'';
    document.getElementById('ar').value=saved.ar||'';
    document.getElementById('savedInfo').innerHTML=`<div class="saved-badge">✅ تم تحميل بياناتك المحفوظة — <a href="#" onclick="clearSaved();return false" style="color:#15803d;font-weight:700">تعديل</a></div>`;
  }
}

function clearSaved(){
  localStorage.removeItem('souna_customer');
  document.getElementById('savedInfo').innerHTML='';
}

function sendWA(){
  const fn=document.getElementById('fn').value;
  const ph=document.getElementById('ph').value;
  const ad=document.getElementById('ad').value;
  if(!fn||!ph||!ad){alert('يرجى تعبئة الاسم ورقم الهاتف والعنوان');return;}
  const ln=document.getElementById('ln').value;
  const ct=document.getElementById('ct').value;
  const ar=document.getElementById('ar').value;
  localStorage.setItem('souna_customer',JSON.stringify({fn,ln,ph,ad,ct,ar}));
  const it=Object.entries(cart).filter(([,q])=>q>0);
  const sub=it.reduce((s,[id,q])=>{const p=PRODS.find(x=>x.id==id);return s+(p?p.price*q:0);},0);
  let msg=`🛒 *طلب جديد - Souna*

👤 *الاسم:* ${fn} ${ln}
📞 *الهاتف:* ${ph}
📍 *العنوان:* ${ad}، ${ar}، ${ct}
`;
  const nt=document.getElementById('nt').value;
  if(nt)msg+=`📝 *ملاحظات:* ${nt}
`;
  msg+=`
*المنتجات:*
`;
  it.forEach(([id,qty])=>{const p=PRODS.find(x=>x.id==id);msg+=`• ${p.name} × ${qty} = $${(p.price*qty).toFixed(2)}
`;});
  msg+=`
💰 *الإجمالي:* $${(sub+2).toFixed(2)} (شامل التوصيل)`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
  sp('success');
}

function sp(name){
  document.querySelectorAll('.pg2').forEach(p=>p.classList.remove('active'));
  document.getElementById(name+'Page').classList.add('active');
  if(name==='cart')rCart();
  if(name==='checkout'){rSum('checkoutSummary');loadSavedInfo();}
  window.scrollTo(0,0);
}
function resetOrder(){cart={};uc();sp('shop');}
rCats();rProds();
</script>
